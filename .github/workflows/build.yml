name: build

on:
  push:
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  # Fast gate on every PR: types + lint. No packaging.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint

  # Per-OS installers, built only when a v* tag is pushed. Each runner produces
  # its own OS's artifact (electron-forge runs only the host's makers) and
  # attaches it to the tag's GitHub Release.
  make:
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write # create/append the Release and upload assets
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Linux packaging deps (rpm/deb)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm fakeroot
      - run: npm ci
      - run: npm run make
      - uses: actions/upload-artifact@v4
        with:
          name: dogwalker-${{ matrix.os }}
          path: out/make/**/*
          if-no-files-found: error
      # Attach this OS's installers to the Release (each job appends to the same
      # tag; the release body comes from CHANGELOG via the release, see below).
      - name: Attach installers to the Release
        uses: softprops/action-gh-release@v2
        with:
          files: out/make/**/*
          fail_on_unmatched_files: true
